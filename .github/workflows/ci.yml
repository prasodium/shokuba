name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

      # Builds the app, then runs it inside real Electron: SQLite, restart persistence,
      # a real PTY and Git detection.
      - name: Smoke test
        if: runner.os != 'Linux'
        run: npm run smoke

      - name: Smoke test (Linux, headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke
